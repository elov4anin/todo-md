name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Verify committed build is current
        run: git diff --exit-code -- dist assets/chart.umd.js

  package-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: mkdir /tmp/todo-md-consumer
      - run: npm init -y
        working-directory: /tmp/todo-md-consumer
      - name: Install directly from checked-out Git repository
        run: npm install --ignore-scripts --no-audit --save-dev "git+file://${GITHUB_WORKSPACE}#${GITHUB_SHA}"
        working-directory: /tmp/todo-md-consumer
      - run: npx todo-md init
        working-directory: /tmp/todo-md-consumer
      - run: npx todo-md validate
        working-directory: /tmp/todo-md-consumer
